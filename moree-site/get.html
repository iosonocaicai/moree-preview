<link rel="stylesheet" href="style.css">
<style>
body{min-height:100svh}
.get{min-height:100svh;padding:110px clamp(18px,4vw,48px) 40px;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.get h1{font-family:var(--display);font-weight:800;font-size:clamp(64px,9vw,140px);letter-spacing:-.05em;line-height:.88;margin:0 0 18px}
.get .lead{font-size:clamp(19px,1.6vw,22px);color:var(--ink-2);margin:0 0 34px}
.qr{display:flex;align-items:center;gap:22px;margin-bottom:30px}
.qr .sq-frame{width:168px;height:168px;flex:none}
.qr .sq{width:100%;height:100%}
.qr .sq .sq{background:#fff;display:grid;place-items:center}
.qr .sq img{width:72%;height:72%;object-fit:contain}
.qr span{color:var(--ink-2);font-size:16px;max-width:18ch}
.stores{display:flex;gap:12px;flex-wrap:wrap}
.stores .btn svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:28px;color:var(--ink-2);text-decoration:none;font-weight:500}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px;transition:transform .3s var(--spring)}
.back:hover svg{transform:translateX(-4px)}
.art{position:relative;aspect-ratio:1/1.05;max-width:520px;width:100%;justify-self:center}
.env{position:absolute;left:8%;right:8%;bottom:6%;aspect-ratio:605/624}
.env img{position:absolute;inset:0;width:100%;height:100%}
.env .front{clip-path:inset(56.5% 0 0 0)}
.cardclip{position:absolute;left:4%;right:4%;top:-45%;bottom:5.5%;overflow:hidden}
.cardclip img{position:absolute;left:0;width:100%;height:auto;bottom:auto;top:68%;animation:rise 1.4s var(--spring) .3s forwards}
@keyframes rise{to{top:36%}}
.art .yel{position:absolute;right:-6%;top:44%;width:30%;rotate:12deg;animation:peek 4s ease-in-out infinite}
@keyframes peek{50%{transform:translateY(-8px) rotate(-4deg)}}
.art .chip{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);background:#fff;border-radius:99px;padding:10px 18px;font-family:var(--hand);font-size:22px;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.25)}
@media (max-width:860px){
  .get{grid-template-columns:1fr;text-align:center;padding-top:90px}
  .art{order:-1;max-width:340px}
  .qr{justify-content:center}.stores{justify-content:center}
}
@media (max-width:600px){.qr{display:none}}
</style>
</head>
